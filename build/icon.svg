      <circle cx="684" cy="790" r="1.6"/>
      <circle cx="740" cy="790" r="1.6"/>
      <circle cx="796" cy="790" r="1.6"/>
      <circle cx="852" cy="790" r="1.6"/>
    </g>

    <path d="M172 556H854" fill="none" stroke="#9BEEFF" stroke-width="2" opacity="0.08"/>

    <!-- serial pulse -->
    <path d="M178 556H296V430H424V606H552V466H680V556H790"
          fill="none" stroke="url(#signal)" stroke-width="64"
          stroke-linecap="round" stroke-linejoin="round"
          opacity="0.46" filter="url(#pulseGlow)"/>
    <path d="M178 556H296V430H424V606H552V466H680V556H790"
          fill="none" stroke="url(#signal)" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M178 556H296V430H424V606H552V466H680V556H790"
          fill="none" stroke="url(#signalCore)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

    <!-- connection node -->
    <circle cx="822" cy="556" r="46" fill="#7EF0C6" opacity="0.11" filter="url(#dotGlow)"/>
    <circle cx="822" cy="556" r="26" fill="#7EF0C6"/>
    <circle cx="822" cy="556" r="26" fill="none" stroke="#E1FFF4" stroke-width="2" opacity="0.62"/>

    <!-- glass light -->
    <rect x="100" y="100" width="824" height="430" fill="url(#glass)"/>
    <rect x="100" y="100" width="824" height="824" fill="none" stroke="#C7F8FF" stroke-width="2" opacity="0.12"/>
  </g>

  <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
        fill="none" stroke="#A7F0FF" stroke-width="2.5" opacity="0.16"/>
</svg>
